name: Verify recovered Vercel production source
on:
  push:
    branches: [codex/vercel-production-source]
permissions:
  contents: read
concurrency:
  group: recovered-production-source
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      NEXT_TELEMETRY_DISABLED: "1"
      ARTICLE_APPROVAL_ENABLED: "false"
      ARTICLE_DAILY_CRON_ENABLED: "false"
      ARTICLE_LINE_POSTBACK_ENABLED: "false"
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "22.23.3"
      - name: Verify deployed source bytes
        run: node scripts/verify-source-provenance.mjs
      - name: Clean install
        run: npm ci
      - name: Lint, typecheck and build
        run: npm run verify
      - name: Tests with mocks and in-memory database
        run: npm test
