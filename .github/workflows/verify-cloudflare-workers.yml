name: Verify Cloudflare Workers
on:
  push:
    branches: [codex/cloudflare-workers]
  pull_request:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: workers-verification-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      NEXT_TELEMETRY_DISABLED: "1"
      SITE_ENV: preview
      ARTICLE_APPROVAL_ENABLED: "false"
      ARTICLE_DAILY_CRON_ENABLED: "false"
      ARTICLE_LINE_POSTBACK_ENABLED: "false"
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build:cloudflare
      - run: npm run typecheck
      - run: npm run check:cloudflare
