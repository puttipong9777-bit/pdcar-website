name: Verify live Pages preview (read only)
on:
  push:
    branches: [migration/cloudflare-pages]
    paths:
      - scripts/verify-live-preview.mjs
      - .github/workflows/verify-live-preview.yml
permissions:
  contents: read
jobs:
  live:
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22.23.3"
      - name: Public GET and HEAD checks only
        run: node scripts/verify-live-preview.mjs
