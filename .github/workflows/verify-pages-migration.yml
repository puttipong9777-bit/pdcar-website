name: Verify Cloudflare Pages migration
on:
  push:
    branches: [migration/cloudflare-pages]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: verify-pages-migration
  cancel-in-progress: false
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      NEXT_TELEMETRY_DISABLED: "1"
      ARTICLE_APPROVAL_ENABLED: "false"
      ARTICLE_DAILY_CRON_ENABLED: "false"
      ARTICLE_LINE_POSTBACK_ENABLED: "false"
      WRANGLER_SEND_METRICS: "false"
    steps:
      - uses: actions/checkout@v4
        with:
          ref: migration/cloudflare-pages
      - uses: actions/setup-node@v4
        with:
          node-version: "22.23.3"
      - name: Resolve package lock on Cloud only
        run: |
          npm install --package-lock-only --ignore-scripts
          if ! git diff --quiet -- package-lock.json; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add package-lock.json
            git commit -m "Lock recovered production and Pages dependencies [skip ci]"
            git push origin HEAD:migration/cloudflare-pages
          fi
          echo "Verified SHA: $(git rev-parse HEAD)"
      - run: npm ci
      - run: npm run verify
      - run: npm test
      - run: npx playwright install --with-deps chromium
      - run: npm run test:browser
      - run: npm run build:next
